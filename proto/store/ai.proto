syntax = "proto3";

package memos.store;

option go_package = "gen/store";

// AIMessagePayload carries the variable metadata of an AI chat message:
// model provenance, usage, citations, and the normalized failure category.
// Hidden provider reasoning is never stored here.
message AIMessagePayload {
  // Citation references the memo an assistant answer was grounded in.
  message Citation {
    // The UID of the cited memo.
    string memo_uid = 1;
    // The quoted source text from the memo.
    string snippet = 2;
    // The revision (update time) of the source memo the snippet was quoted
    // from.
    int64 source_revision = 3;
    // The hash of the source content the snippet was quoted from.
    string source_hash = 4;
    // The byte range of the quoted snippet within the source content.
    int32 source_start = 5;
    int32 source_end = 6;
  }

  // The provider ID that produced the message.
  string provider_id = 1;

  // The model name that produced the message.
  string model = 2;

  // Provider-reported token usage where available.
  int32 input_tokens = 3;
  int32 output_tokens = 4;
  int32 total_tokens = 5;

  // Source citations backing an assistant message.
  repeated Citation citations = 6;

  // The normalized error category when the attempt failed.
  string error = 7;

  // Machine-readable partial/degraded reasons from the retrieval phase, such
  // as "time_budget_exhausted". Empty means retrieval covered the searchable
  // corpus completely.
  repeated string retrieval_reasons = 8;
}
