syntax = "proto3";

package memos.api.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gen/api/v1";

service AIService {
  // Transcribe transcribes an audio file using an instance AI provider.
  rpc Transcribe(TranscribeRequest) returns (TranscribeResponse) {
    option (google.api.http) = {
      post: "/api/v1/ai:transcribe"
      body: "*"
    };
    option (google.api.method_signature) = "audio";
  }
  // SendChatMessage sends a user message in the caller's AI chat conversation
  // and returns the stored user message together with the assistant's reply.
  rpc SendChatMessage(SendChatMessageRequest) returns (SendChatMessageResponse) {
    option (google.api.http) = {
      post: "/api/v1/ai/chat:sendMessage"
      body: "*"
    };
    option (google.api.method_signature) = "content";
  }
  // GetChatConversation returns the caller's AI chat conversation.
  rpc GetChatConversation(GetChatConversationRequest) returns (ChatConversation) {
    option (google.api.http) = {get: "/api/v1/ai/chat/conversation"};
    option (google.api.method_signature) = "";
  }
}

message TranscribeRequest {
  // Required. Audio input.
  TranscriptionAudio audio = 1 [(google.api.field_behavior) = REQUIRED];
}

message TranscriptionAudio {
  oneof source {
    // Inline audio bytes.
    bytes content = 1 [(google.api.field_behavior) = INPUT_ONLY];

    // URI for audio content. Reserved for future use.
    string uri = 2;
  }

  // Optional. The uploaded filename.
  string filename = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The MIME type of the input audio.
  string content_type = 4 [(google.api.field_behavior) = OPTIONAL];
}

message TranscribeResponse {
  // The transcribed text.
  string text = 1;
}

// ChatMessage is a single message in an AI chat conversation.
message ChatMessage {
  // Role identifies the author of a chat message.
  enum Role {
    ROLE_UNSPECIFIED = 0;
    // The message was written by the user.
    USER = 1;
    // The message was generated by the AI assistant.
    ASSISTANT = 2;
  }

  // The author of the message.
  Role role = 1;

  // The text content of the message.
  string content = 2;

  // The time the message was created.
  google.protobuf.Timestamp create_time = 3;

  // Source citations backing the message. Only set on assistant messages.
  repeated ChatCitation citations = 4;
}

// ChatCitation references the memo a chat answer was grounded in.
message ChatCitation {
  // The resource name of the cited memo.
  // Format: memos/{memo}
  string memo = 1;

  // The quoted source text from the memo.
  string snippet = 2;
}

// ChatConversation is the caller's single conversation thread with the AI assistant.
message ChatConversation {
  // The messages in the conversation, in chronological order.
  repeated ChatMessage messages = 1;

  // Whether the instance has a generation model configured.
  // When false, the assistant cannot generate new replies.
  bool generation_available = 2;
}

message SendChatMessageRequest {
  // Required. The text content of the user's message.
  string content = 1 [(google.api.field_behavior) = REQUIRED];
}

message SendChatMessageResponse {
  // The stored user message.
  ChatMessage user_message = 1;

  // The assistant's reply message.
  ChatMessage assistant_message = 2;
}

message GetChatConversationRequest {}
