syntax = "proto3";

package memos.api.v1;

import "api/v1/memo_service.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gen/api/v1";

service AIService {
  // Transcribe transcribes an audio file using an instance AI provider.
  rpc Transcribe(TranscribeRequest) returns (TranscribeResponse) {
    option (google.api.http) = {
      post: "/api/v1/ai:transcribe"
      body: "*"
    };
    option (google.api.method_signature) = "audio";
  }
  // CreateChatConversation creates a new AI chat conversation owned by the caller.
  rpc CreateChatConversation(CreateChatConversationRequest) returns (ChatConversation) {
    option (google.api.http) = {
      post: "/api/v1/ai/chat/conversations"
      body: "*"
    };
    option (google.api.method_signature) = "";
  }
  // ListChatConversations lists the caller's AI chat conversations, most
  // recently updated first. Messages are not populated.
  rpc ListChatConversations(ListChatConversationsRequest) returns (ListChatConversationsResponse) {
    option (google.api.http) = {get: "/api/v1/ai/chat/conversations"};
    option (google.api.method_signature) = "";
  }
  // GetChatConversation returns one of the caller's AI chat conversations
  // with its messages.
  rpc GetChatConversation(GetChatConversationRequest) returns (ChatConversation) {
    option (google.api.http) = {get: "/api/v1/{name=ai/conversations/*}"};
    option (google.api.method_signature) = "name";
  }
  // DeleteChatConversation deletes one of the caller's AI chat conversations.
  // An attempt still generating is cancelled.
  rpc DeleteChatConversation(DeleteChatConversationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/{name=ai/conversations/*}"};
    option (google.api.method_signature) = "name";
  }
  // SendChatMessage sends a user message in one of the caller's AI chat
  // conversations and streams the assistant's reply attempt. The stream
  // starts with the stored user message and attempt, streams answer deltas,
  // and ends with the authoritative stored assistant attempt. Reconnecting
  // clients reconcile against the stored conversation state.
  //
  // Server streaming is served over the Connect endpoint only; the
  // gRPC-Gateway JSON transport does not support streaming methods.
  rpc SendChatMessage(SendChatMessageRequest) returns (stream SendChatMessageEvent) {
    option (google.api.method_signature) = "conversation,content,request_id";
  }
  // SearchMemos searches the memos the caller may read with exact, partial,
  // and typo-tolerant matching over the derived search documents. Every
  // result is reauthorized and revision-checked against the current source
  // memo before its snippet is returned. Search works with no generation or
  // embedding configuration.
  rpc SearchMemos(SearchMemosRequest) returns (SearchMemosResponse) {
    option (google.api.http) = {
      post: "/api/v1/ai/search/memos"
      body: "*"
    };
    option (google.api.method_signature) = "query";
  }
}

message TranscribeRequest {
  // Required. Audio input.
  TranscriptionAudio audio = 1 [(google.api.field_behavior) = REQUIRED];
}

message TranscriptionAudio {
  oneof source {
    // Inline audio bytes.
    bytes content = 1 [(google.api.field_behavior) = INPUT_ONLY];

    // URI for audio content. Reserved for future use.
    string uri = 2;
  }

  // Optional. The uploaded filename.
  string filename = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The MIME type of the input audio.
  string content_type = 4 [(google.api.field_behavior) = OPTIONAL];
}

message TranscribeResponse {
  // The transcribed text.
  string text = 1;
}

// ChatMessage is a single message in an AI chat conversation.
message ChatMessage {
  // Role identifies the author of a chat message.
  enum Role {
    ROLE_UNSPECIFIED = 0;
    // The message was written by the user.
    USER = 1;
    // The message was generated by the AI assistant.
    ASSISTANT = 2;
  }

  // Status is the lifecycle state of a chat message.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The assistant is still generating the message.
    STREAMING = 1;
    // The message is complete.
    COMPLETE = 2;
    // Generation failed; the message carries no visible content.
    FAILED = 3;
    // Generation was cancelled before completion.
    CANCELLED = 4;
  }

  // The author of the message.
  Role role = 1;

  // The visible text content of the message. Hidden provider reasoning is
  // neither requested nor stored.
  string content = 2;

  // The time the message was created.
  google.protobuf.Timestamp create_time = 3;

  // Source citations backing the message. Only set on assistant messages.
  repeated ChatCitation citations = 4;

  // The lifecycle status of the message.
  Status status = 5;

  // The attempt number of an assistant message answering its user message;
  // 0 for user messages.
  int32 attempt = 6;

  // The client request ID of a user message; empty for assistant messages.
  string client_request_id = 7;

  // Machine-readable partial/degraded reasons from the retrieval phase, such
  // as "time_budget_exhausted"; empty means retrieval covered the searchable
  // corpus completely. Only set on assistant messages.
  repeated string retrieval_reasons = 8;
}

// ChatCitation references the memo a chat answer was grounded in.
message ChatCitation {
  // The resource name of the cited memo.
  // Format: memos/{memo}
  string memo = 1;

  // The quoted source text from the memo.
  string snippet = 2;

  // The revision (update time) of the source memo the snippet was quoted
  // from.
  google.protobuf.Timestamp source_revision = 3;

  // The hash of the source content the snippet was quoted from.
  string source_hash = 4;

  // The byte range of the quoted snippet within the source content.
  int32 source_start = 5;
  int32 source_end = 6;
}

// ChatConversation is a private AI chat conversation owned by a user.
message ChatConversation {
  // The messages in the conversation, in chronological order. Populated by
  // GetChatConversation only.
  repeated ChatMessage messages = 1;

  // Whether the instance has a generation model configured.
  // When false, the assistant cannot generate new replies.
  bool generation_available = 2;

  // The resource name of the conversation.
  // Format: ai/conversations/{conversation}
  string name = 3;

  // The conversation title. Derived from the first user message when the
  // conversation was created without one.
  string title = 4;

  // The time the conversation was created.
  google.protobuf.Timestamp create_time = 5;

  // The last time the conversation or its messages changed.
  google.protobuf.Timestamp update_time = 6;
}

message CreateChatConversationRequest {
  // Optional. The conversation title; derived from the first user message
  // when empty.
  string title = 1 [(google.api.field_behavior) = OPTIONAL];
}

message ListChatConversationsRequest {}

message ListChatConversationsResponse {
  // The caller's conversations, most recently updated first. Messages are
  // not populated.
  repeated ChatConversation conversations = 1;

  // Whether the instance has a generation model configured.
  bool generation_available = 2;
}

message GetChatConversationRequest {
  // Required. The resource name of the conversation.
  // Format: ai/conversations/{conversation}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeleteChatConversationRequest {
  // Required. The resource name of the conversation.
  // Format: ai/conversations/{conversation}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message SendChatMessageRequest {
  // Required. The text content of the user's message.
  string content = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The resource name of the conversation the message belongs to.
  // Format: ai/conversations/{conversation}
  string conversation = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. Client-generated request ID, unique within the conversation.
  // Repeating it returns the existing user message and its active or
  // completed attempt; repeating it after the attempt failed or was
  // cancelled creates a new attempt on the same user message.
  string request_id = 3 [(google.api.field_behavior) = REQUIRED];
}

// SendChatMessageEvent is one event of a SendChatMessage stream.
message SendChatMessageEvent {
  // The event payload.
  oneof event {
    // The first event: the stored user message and the assistant attempt
    // being answered. A repeated request ID whose attempt is still active
    // returns only this event; the stored state stays authoritative.
    SendChatMessageStart start = 1;

    // An incremental assistant answer delta. Deltas concatenate into the
    // answer but are not authoritative; the complete event is.
    string delta = 2;

    // The terminal event: the authoritative stored assistant attempt,
    // whether it completed, failed, or was cancelled.
    ChatMessage complete = 3;
  }
}

// SendChatMessageStart carries the persisted pair an answer streams for.
message SendChatMessageStart {
  // The stored user message.
  ChatMessage user_message = 1;

  // The assistant attempt answering it, still generating.
  ChatMessage assistant_message = 2;
}

message SearchMemosRequest {
  // Required. The free-text query, matched exactly, partially, and with typo
  // tolerance against normalized memo titles, tags, and content.
  string query = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. Structured filters narrowing the search candidates.
  SearchMemosFilter filter = 2 [(google.api.field_behavior) = OPTIONAL];
}

// SearchMemosFilter narrows search candidates by structured product intent.
// All set fields must hold for a memo to appear in the results.
message SearchMemosFilter {
  // Optional. Memos must carry all of these tags.
  repeated string tags = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Memos must be created at or after this time.
  google.protobuf.Timestamp created_after = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Memos must be created at or before this time.
  google.protobuf.Timestamp created_before = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Memos must have exactly this visibility.
  Visibility visibility = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Memos must be created by this user.
  // Format: users/{user_id}
  string creator = 5 [(google.api.field_behavior) = OPTIONAL];
}

// MemoSearchResult is one memo matching a search query. The snippet is quoted
// from the memo's current source after reauthorization and revision checking;
// it can never carry stale indexed text.
message MemoSearchResult {
  // The resource name of the matching memo.
  // Format: memos/{memo}
  string memo = 1;

  // The quoted source text around the strongest match.
  string snippet = 2;

  // Machine-readable reasons the result ranked, such as "title_exact" or
  // "content_fuzzy".
  repeated string rank_reasons = 3;

  // The revision (update time) of the source memo the snippet was quoted
  // from.
  google.protobuf.Timestamp source_revision = 4;

  // The hash of the source content the snippet was quoted from.
  string source_hash = 5;

  // The byte range of the quoted snippet within the source content.
  int32 source_start = 6;
  int32 source_end = 7;
}

message SearchMemosResponse {
  // The ranked results, best first.
  repeated MemoSearchResult results = 1;

  // Machine-readable reasons the coverage is partial or degraded, such as
  // "scan_budget_exhausted". Empty means the searchable corpus was covered
  // completely; partial coverage is never presented as complete.
  repeated string partial_reasons = 2;
}
